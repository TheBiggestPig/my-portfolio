<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James Aaron Balan — 2D Artist Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* --- THEME VARIABLES --- */
:root {
    --bg: #f9f8f4;
    --card-bg: #ffffff;
    --accent: #ff6b6b;
    --text: #1e272e;
    --subtext: #a0a0a0;
    --char: #e6a800;
    --env: #00a87a;
    --con: #7c5fe6;
    --filter-bar: rgba(249, 248, 244, 0.8);
    --card-shadow: rgba(0,0,0,0.06);
    --card-shadow-hover: rgba(0,0,0,0.12);
}

/* DARK MODE OVERRIDES */
body.dark-mode {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text: #f1f1f1;
    --subtext: #777;
    --filter-bar: rgba(18, 18, 18, 0.85);
    --card-shadow: rgba(0,0,0,0.4);
    --card-shadow-hover: rgba(0,0,0,0.6);
}

/* --- RESET & BASE --- */
*{margin:0;padding:0;box-sizing:border-box}
body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease; /* Smooth mode switch */
}

/* --- THEME TOGGLE BUTTON --- */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--subtext);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-size: 1.2rem;
    transition: transform 0.2s;
}
.theme-toggle:hover { transform: scale(1.1); }

header { padding: 5rem 2rem 2rem; text-align: center; }
.logo { font-family: 'Fredoka One', cursive; font-size: 3.8rem; letter-spacing: -2px; color: var(--text); }
.logo span { color: var(--accent); }
.tagline { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.3em; color: var(--subtext); text-transform: uppercase; }

/* --- FILTERS --- */
.filter-row {
    display: flex; justify-content: center; gap: 10px; padding: 2rem; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 1000;
    background: var(--filter-bar); 
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background-color 0.4s ease;
}
.filter-btn {
    border: none; padding: 0.7rem 1.5rem; border-radius: 50px; 
    background: var(--card-bg); color: var(--text);
    font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
    transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.filter-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
.filter-btn.active { background: var(--text); color: var(--bg); }
.filter-btn.active[data-filter="character"] { background: var(--char); color: #fff; }
.filter-btn.active[data-filter="background"] { background: var(--env); color: #fff; }
.filter-btn.active[data-filter="concept"] { background: var(--con); color: #fff; }

/* --- MASONRY GALLERY --- */
.gallery-container { max-width: 1400px; margin: 0 auto; padding: 0 2rem 5rem; }
.gallery { columns: 3; column-gap: 2rem; }
@media (max-width: 1000px) { .gallery { columns: 2; } }
@media (max-width: 600px) { .gallery { columns: 1; } }

.card {
    break-inside: avoid-column;
    margin-bottom: 2.5rem;
    position: relative;
    cursor: pointer;
    border-radius: 20px;
    isolation: isolate; 
    background: var(--card-bg);
    box-shadow: 0 10px 30px var(--card-shadow);
    transition: box-shadow 0.4s ease, background-color 0.4s ease;
}

.card-content {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    contain: paint; 
    background: var(--card-bg);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backface-visibility: hidden; 
}

.card img {
    width: 100%; display: block;
    transition: transform 0.6s ease;
    will-change: transform;
}

.card:hover { box-shadow: 0 20px 40px var(--card-shadow-hover); }
.card:hover .card-content { transform: translateY(-8px); }
.card:hover img { transform: scale(1.04); }

.card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    display: flex; align-items: flex-end; padding: 1.5rem;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
.card:hover .card-overlay { opacity: 1; }
.card-title { color: #fff; font-family: 'Fredoka One', cursive; font-size: 1.1rem; }

/* --- LIGHTBOX POPUP --- */
.lb-wrap {
    position: fixed; inset: 0; background: rgba(10, 10, 10, 0.98);
    display: none; z-index: 6000; align-items: center; justify-content: center;
    backdrop-filter: blur(15px); padding: 1rem;
}
.lb-wrap.open { display: flex; }
.lb-box { max-width: 1100px; width: 100%; display: flex; flex-direction: column; align-items: center; }
.lb-img-container { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; border: 1px solid #333; }
.lb-img-container img { max-width: 100%; max-height: 75vh; display: block; }
.lb-name { color: #fff; font-family: 'Fredoka One', cursive; font-size: 2rem; margin-bottom: 0.5rem; text-align: center; }
.lb-nav { display: flex; gap: 12px; }
.btn { border: none; padding: 0.8rem 1.8rem; border-radius: 50px; font-weight: 800; cursor: pointer; transition: 0.2s; }
.btn-main { background: #fff; color: #000; }
.btn-close { background: var(--accent); color: #fff; }
.btn:hover { transform: scale(1.05); }

.pill-container { display: flex; gap: 8px; margin-bottom: 1rem; }
.pill { padding: 4px 12px; border-radius: 20px; color: #fff; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
.tag-character { background: var(--char); }
.tag-background { background: var(--env); }
.tag-concept { background: var(--con); }
.count-badge { text-align: center; font-weight: 800; color: var(--subtext); font-size: 0.75rem; margin-bottom: 2rem; }
</style>
</head>
<body>

<!-- THEME TOGGLE -->
<div class="theme-toggle" id="theme-toggle" title="Toggle Dark/Light Mode">🌓</div>

<header>
    <div class="logo">James Aaron Balan<span>.</span></div>
    <div class="tagline">2D Artist &bull; Character Designer &bull; Concept Artist</div>
</header>

<div class="filter-row">
    <button class="filter-btn active" data-filter="all">All Portfolio</button>
    <button class="filter-btn" data-filter="character">Characters</button>
    <button class="filter-btn" data-filter="background">Environments</button>
    <button class="filter-btn" data-filter="concept">Concepts</button>
</div>

<div class="count-badge" id="count-badge">COLLECTION</div>

<div class="gallery-container">
    <div class="gallery" id="gallery"></div>
</div>

<!-- LIGHTBOX -->
<div class="lb-wrap" id="lb-wrap">
    <div class="lb-box">
        <div class="lb-img-container"><img id="lb-img" src="" alt=""></div>
        <div class="lb-name" id="lb-title"></div>
        <div class="pill-container" id="lb-pill-box"></div>
        <div class="lb-nav">
            <button class="btn btn-main" id="lb-prev">← PREV</button>
            <button class="btn btn-close" id="lb-close">CLOSE</button>
            <button class="btn btn-main" id="lb-next">NEXT →</button>
        </div>
    </div>
</div>

<script>
// --- THEME LOGIC ---
const themeToggle = document.getElementById('theme-toggle');
const body = document.body;

// Check for saved theme
if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-mode');
    themeToggle.textContent = '☀️';
}

themeToggle.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    const isDark = body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? '☀️' : '🌓';
});

// --- ART DATA ---
const myArt = [
    { src: 'images/c1c2_front.png', name: 'c1 and c2 ref', tags: ['character', 'concept'] },
    { src: 'images/11_ghost_jewel_big_green_apple.png', name: 'C11 and Jewel Fanart', tags: ['character'] },
    { src: 'images/c3_monolithic.jpg', name: 'C3 Monolithic', tags: ['character'] },
    { src: 'images/c3_old.png', name: 'C3 Old', tags: ['character'] },
    { src: 'images/c3_oldref.png', name: 'C3 Old Ref', tags: ['character', 'concept'] },
    { src: 'images/c3_wired.png', name: 'C3 Wired', tags: ['character'] },
    { src: 'images/c4_ref.png', name: 'C4 Ref', tags: ['character', 'concept'] },
    { src: 'images/c5_domain.jpg', name: 'C5 Domain', tags: ['character'] },
    { src: 'images/c8_wall.png', name: 'C8 Wall', tags: ['character'] },
    { src: 'images/c9.png', name: 'C9', tags: ['character'] },
    { src: 'images/c9_cloud.png', name: 'C9 Cloud', tags: ['character'] },
    { src: 'images/c9_cloud2.png', name: 'C9 Cloud 2', tags: ['character'] },
    { src: 'images/c9_concept.png', name: 'C9 Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_avianalt_concept.png', name: 'C11 Alt Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_dawn.png', name: 'C11 Dawn', tags: ['character'] },
    { src: 'images/c11_magic.png', name: 'C11 Magic', tags: ['character'] },
    { src: 'images/c11_summit.png', name: 'C11 Summit', tags: ['character'] },
    { src: 'images/c11_twilight.png', name: 'C11 Twilight', tags: ['character'] },
    { src: 'images/c34_lab.jpg', name: 'C34 Lab', tags: ['character'] },
    { src: 'images/c78_wall.png', name: 'C78 Wall', tags: ['character'] },
    { src: 'images/catalyst_bg.png', name: 'Catalyst', tags: ['background'] },
    { src: 'images/character9float.png', name: 'Character 9 Float', tags: ['character'] },
    { src: 'images/thing.png', name: 'Thing', tags: ['background'] },
    { src: 'images/towers_bg.png', name: 'Towers', tags: ['background'] },
    { src: 'images/towerv2_bg.png', name: 'Tower V2', tags: ['background'] },
    { src: 'images/triangle_bg.png', name: 'Triangle', tags: ['background'] },
    { src: 'images/water.png', name: 'Water', tags: ['background'] },
    { src: 'images/aether_bg.png', name: 'Aether', tags: ['background'] },
    { src: 'images/airship_bg.png', name: 'Airship', tags: ['background'] },
    { src: 'images/bgs_concept.png', name: 'BGs Concept', tags: ['background', 'concept'] },
    { src: 'images/domain.jpg', name: 'Domain', tags: ['background'] },
    { src: 'images/figment_concept.png', name: 'Figment Concept', tags: ['background', 'concept'] },
    { src: 'images/northman_concept.png', name: 'Northman Concept', tags: ['character', 'concept'] },
    { src: 'images/scatter_bg.png', name: 'Scatter', tags: ['background'] },
    { src: 'images/Shapes.png', name: 'Shapes', tags: ['background'] },
    { src: 'images/ship2_bg.png', name: 'Ship 2', tags: ['background'] },
    { src: 'images/shipconcept.png', name: 'Ship Concept', tags: ['background', 'concept'] },
    { src: 'images/tank_bg.png', name: 'Tank', tags: ['background'] }
];

const gallery=document.getElementById('gallery');
const lbWrap=document.getElementById('lb-wrap');
const lbImg=document.getElementById('lb-img');
const lbTitle=document.getElementById('lb-title');
const lbPills=document.getElementById('lb-pill-box');
const cnt=document.getElementById('count-badge');
let activeFilters = [], filtered=[], idx=0;

function render(){
    gallery.innerHTML = '';
    filtered = myArt.filter(item => {
        if (activeFilters.length === 0) return true;
        return activeFilters.every(f => item.tags.includes(f));
    });
    cnt.textContent = filtered.length + ' PIECES REVEALED';
    
    filtered.forEach((w,i)=>{
        const c=document.createElement('div');
        c.className='card';
        c.innerHTML=`<div class="card-content">
            <img src="${w.src}" alt="${w.name}">
            <div class="card-overlay"><div class="card-title">${w.name}</div></div>
        </div>`;
        c.addEventListener('click',()=>openLb(i));
        gallery.appendChild(c);
    });
}

function openLb(i){
    idx=i; const w=filtered[i];
    lbImg.src=w.src; lbTitle.textContent=w.name;
    lbPills.innerHTML = w.tags.map(t => `<span class="pill tag-${t}">${t}</span>`).join('');
    lbWrap.classList.add('open');
    document.body.style.overflow = 'hidden'; 
}

function closeLb(){
    lbWrap.classList.remove('open');
    document.body.style.overflow = 'auto'; 
}

lbWrap.addEventListener('click', (e) => { if (e.target === lbWrap) closeLb(); });
document.getElementById('lb-close').addEventListener('click',closeLb);
document.getElementById('lb-prev').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx-1+filtered.length)%filtered.length; openLb(idx); });
document.getElementById('lb-next').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx+1)%filtered.length; openLb(idx); });

document.addEventListener('keydown', (e) => {
    if (!lbWrap.classList.contains('open')) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") { idx=(idx-1+filtered.length)%filtered.length; openLb(idx); }
    if (e.key === "ArrowRight") { idx=(idx+1)%filtered.length; openLb(idx); }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const f = btn.dataset.filter;
        if (f === 'all') {
            activeFilters = [];
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        } else {
            document.querySelector('[data-filter="all"]').classList.remove('active');
            if (activeFilters.includes(f)) {
                activeFilters = activeFilters.filter(item => item !== f);
                btn.classList.remove('active');
            } else {
                activeFilters.push(f);
                btn.classList.add('active');
            }
            if (activeFilters.length === 0) document.querySelector('[data-filter="all"]').classList.add('active');
        }
        render();
    });
});

render();
</script>
</body>
</html>
