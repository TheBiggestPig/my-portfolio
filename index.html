<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigOne — 2D Artist Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #fcfaf2;
    --card-bg: #ffffff;
    --accent: #ff6b6b;
    --char: #e6a800;
    --bg-tag: #00a87a;
    --con: #7c5fe6;
    --text: #2d3436;
}

/* --- GLOBAL SETUP --- */
*{margin:0;padding:0;box-sizing:border-box}
body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(#e8e4d8 1px, transparent 1px);
    background-size: 40px 40px; /* Subtle grid texture */
    color: var(--text);
    overflow-x: hidden;
}

header {
    padding: 4rem 2rem 2rem;
    text-align: center;
}

.logo {
    font-family: 'Fredoka One', cursive;
    font-size: 3.5rem;
    color: var(--text);
    letter-spacing: -1px;
    margin-bottom: 0.5rem;
}

.logo .dot { color: var(--accent); }

.tagline {
    font-size: 0.9rem;
    font-weight: 800;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.2em;
}

/* --- DECORATIVE STRIP --- */
.color-strip {
    display: flex;
    height: 4px;
    width: 200px;
    margin: 1.5rem auto;
    border-radius: 99px;
    overflow: hidden;
    opacity: 0.6;
}
.color-strip div { flex: 1; }

/* --- FILTERS --- */
.filter-row {
    display: flex;
    gap: 0.8rem;
    padding: 1rem 2rem 3rem;
    flex-wrap: wrap;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.filter-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 0.6rem 1.4rem;
    border-radius: 99px;
    cursor: pointer;
    border: 2px solid #eee;
    background: white;
    color: #666;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

.filter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.05);
    border-color: #ddd;
}

.filter-btn.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
}

/* Custom Active Colors */
.filter-btn.active[data-filter="character"] { background: var(--char); border-color: var(--char); }
.filter-btn.active[data-filter="background"] { background: var(--bg-tag); border-color: var(--bg-tag); }
.filter-btn.active[data-filter="concept"] { background: var(--con); border-color: var(--con); }

/* --- MASONRY GALLERY --- */
.gallery {
    columns: 3;
    column-gap: 1.5rem;
    padding: 0 4rem 4rem;
    max-width: 1600px;
    margin: 0 auto;
}

@media(max-width: 1100px) { .gallery { columns: 2; padding: 0 2rem 2rem; } }
@media(max-width: 600px) { .gallery { columns: 1; padding: 0 1.5rem 1.5rem; } }

.card {
    break-inside: avoid;
    margin-bottom: 1.5rem;
    border-radius: 20px;
    overflow: hidden;
    cursor: zoom-in;
    background: var(--card-bg);
    border: 1px solid rgba(0,0,0,0.05);
    position: relative;
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    box-shadow: 0 10px 20px rgba(0,0,0,0.03);
}

.card img {
    width: 100%;
    display: block;
    transition: transform 0.6s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

.card:hover img { transform: scale(1.03); }

.card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.5rem;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.card:hover .card-overlay { opacity: 1; }

.card-name {
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    transform: translateY(10px);
    transition: transform 0.3s ease;
}

.card:hover .card-name { transform: translateY(0); }

/* --- LIGHTBOX --- */
.lb-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(252, 250, 242, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.lb-wrap.open { display: flex; animation: fadeIn 0.3s ease forwards; }

.lb-content {
    max-width: 90%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.lb-img-box {
    box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    border-radius: 12px;
    overflow: hidden;
    background: white;
    line-height: 0;
}

.lb-img-box img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
}

.lb-info {
    margin-top: 1.5rem;
    text-align: center;
}

.lb-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 0.5rem;
}

.lb-nav {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
}

.lb-btn {
    background: var(--text);
    color: white;
    border: none;
    padding: 0.8rem 1.8rem;
    border-radius: 99px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.lb-btn:hover { opacity: 0.9; transform: scale(1.05); }
.lb-btn.close { background: var(--accent); }

.pill {
    font-size: 0.7rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 99px;
    color: white;
    text-transform: uppercase;
}
.tag-character { background: var(--char); }
.tag-background { background: var(--bg-tag); }
.tag-concept { background: var(--con); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.count-badge {
    text-align: center;
    font-weight: 800;
    color: #bbb;
    letter-spacing: 0.1em;
    margin-bottom: 2rem;
    font-size: 0.8rem;
}
</style>
</head>
<body>

<header>
    <div class="logo">BigOne<span class="dot">.</span></div>
    <div class="tagline">Visual Storyteller &nbsp;•&nbsp; 2D Artist</div>
    <div class="color-strip">
        <div style="background:#ff6b6b"></div>
        <div style="background:#e6a800"></div>
        <div style="background:#00a87a"></div>
        <div style="background:#7c5fe6"></div>
    </div>
</header>

<div class="filter-row">
    <button class="filter-btn active" data-filter="all">All Works</button>
    <button class="filter-btn" data-filter="character">Characters</button>
    <button class="filter-btn" data-filter="background">Environments</button>
    <button class="filter-btn" data-filter="concept">Concepts</button>
</div>

<div class="count-badge" id="count-badge">---</div>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div class="lb-wrap" id="lb-wrap">
    <div class="lb-content">
        <div class="lb-img-box">
            <img id="lb-img" src="" alt="">
        </div>
        <div class="lb-info">
            <div class="lb-title" id="lb-title"></div>
            <div id="lb-pill-box" style="display:flex;gap:8px;justify-content:center"></div>
            <div class="lb-nav">
                <button class="lb-btn" id="lb-prev">PREV</button>
                <button class="lb-btn close" id="lb-close">CLOSE</button>
                <button class="lb-btn" id="lb-next">NEXT</button>
            </div>
        </div>
    </div>
</div>

<script>
const myArt = [
    { src: 'images/11_ghost_jewel_big_green_apple.png', name: 'C11 and Jewel Fanart', tags: ['character'] },
    { src: 'images/c3_monolithic.jpg', name: 'C3 Monolithic', tags: ['character'] },
    { src: 'images/c3_old.png', name: 'C3 Old', tags: ['character'] },
    { src: 'images/c3_oldref.png', name: 'C3 Old Ref', tags: ['character', 'concept'] },
    { src: 'images/c3_wired.png', name: 'C3 Wired', tags: ['character'] },
    { src: 'images/c4_ref.png', name: 'C4 Ref', tags: ['character', 'concept'] },
    { src: 'images/c5_domain.jpg', name: 'C5 Domain', tags: ['character'] },
    { src: 'images/c8_wall.png', name: 'C8 Wall', tags: ['character'] },
    { src: 'images/c9.png', name: 'C9', tags: ['character'] },
    { src: 'images/c9_cloud.png', name: 'C9 Cloud', tags: ['character'] },
    { src: 'images/c9_cloud2.png', name: 'C9 Cloud 2', tags: ['character'] },
    { src: 'images/c9_concept.png', name: 'C9 Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_avianalt_concept.png', name: 'C11 Alt Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_dawn.png', name: 'C11 Dawn', tags: ['character'] },
    { src: 'images/c11_magic.png', name: 'C11 Magic', tags: ['character'] },
    { src: 'images/c11_summit.png', name: 'C11 Summit', tags: ['character'] },
    { src: 'images/c11_twilight.png', name: 'C11 Twilight', tags: ['character'] },
    { src: 'images/c34_lab.jpg', name: 'C34 Lab', tags: ['character'] },
    { src: 'images/c78_wall.png', name: 'C78 Wall', tags: ['character'] },
    { src: 'images/catalyst_bg.png', name: 'Catalyst', tags: ['background'] },
    { src: 'images/character9float.png', name: 'Character 9 Float', tags: ['character'] },
    { src: 'images/thing.png', name: 'Thing', tags: ['background'] },
    { src: 'images/towers_bg.png', name: 'Towers', tags: ['background'] },
    { src: 'images/towerv2_bg.png', name: 'Tower V2', tags: ['background'] },
    { src: 'images/triangle_bg.png', name: 'Triangle', tags: ['background'] },
    { src: 'images/water.png', name: 'Water', tags: ['background'] },
    { src: 'images/aether_bg.png', name: 'Aether', tags: ['background'] },
    { src: 'images/airship_bg.png', name: 'Airship', tags: ['background'] },
    { src: 'images/bgs_concept.png', name: 'BGs Concept', tags: ['background', 'concept'] },
    { src: 'images/domain.jpg', name: 'Domain', tags: ['background'] },
    { src: 'images/figment_concept.png', name: 'Figment Concept', tags: ['background', 'concept'] },
    { src: 'images/northman_concept.png', name: 'Northman Concept', tags: ['character', 'concept'] },
    { src: 'images/scatter_bg.png', name: 'Scatter', tags: ['background'] },
    { src: 'images/Shapes.png', name: 'Shapes', tags: ['background'] },
    { src: 'images/ship2_bg.png', name: 'Ship 2', tags: ['background'] },
    { src: 'images/shipconcept.png', name: 'Ship Concept', tags: ['background', 'concept'] },
    { src: 'images/tank_bg.png', name: 'Tank', tags: ['background'] }
];

const gallery=document.getElementById('gallery');
const lbWrap=document.getElementById('lb-wrap');
const lbImg=document.getElementById('lb-img');
const lbTitle=document.getElementById('lb-title');
const cnt=document.getElementById('count-badge');
const lbPills=document.getElementById('lb-pill-box');
let activeFilters = [], filtered=[], idx=0;

function render(){
    gallery.innerHTML = '';
    filtered = myArt.filter(item => {
        if (activeFilters.length === 0) return true;
        return activeFilters.every(filter => item.tags.includes(filter));
    });
    cnt.textContent = filtered.length + ' PIECES REVEALED';
    
    filtered.forEach((w,i)=>{
        const c=document.createElement('div');
        c.className='card';
        c.innerHTML=`<img src="${w.src}" alt="${w.name}"><div class="card-overlay"><div class="card-name">${w.name}</div></div>`;
        c.addEventListener('click',()=>openLb(i));
        gallery.appendChild(c);
    });
}

function openLb(i){
    idx=i; const w=filtered[i];
    lbImg.src=w.src; lbTitle.textContent=w.name;
    lbPills.innerHTML = w.tags.map(t => `<span class="pill tag-${t}">${t}</span>`).join('');
    lbWrap.classList.add('open');
    document.body.style.overflow = 'hidden'; 
}

function closeLb(){
    lbWrap.classList.remove('open');
    document.body.style.overflow = 'auto'; 
}

lbWrap.addEventListener('click', (e) => { if (e.target === lbWrap) closeLb(); });
document.getElementById('lb-close').addEventListener('click',closeLb);
document.getElementById('lb-prev').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx-1+filtered.length)%filtered.length; openLb(idx); });
document.getElementById('lb-next').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx+1)%filtered.length; openLb(idx); });

document.addEventListener('keydown', (e) => {
    if (!lbWrap.classList.contains('open')) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") { idx=(idx-1+filtered.length)%filtered.length; openLb(idx); }
    if (e.key === "ArrowRight") { idx=(idx+1)%filtered.length; openLb(idx); }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        if (filter === 'all') {
            activeFilters = [];
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        } else {
            document.querySelector('[data-filter="all"]').classList.remove('active');
            if (activeFilters.includes(filter)) {
                activeFilters = activeFilters.filter(f => f !== filter);
                btn.classList.remove('active');
            } else {
                activeFilters.push(filter);
                btn.classList.add('active');
            }
            if (activeFilters.length === 0) document.querySelector('[data-filter="all"]').classList.add('active');
        }
        render();
    });
});

render();
</script>
</body>
</html>
