<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigOne — 2D Artist Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* --- CYBER DARK THEME VARIABLES --- */
:root {
    --bg: #0a0a0a;
    --card-bg: #161616;
    --accent: #ff6b6b;
    --cyan: #00f3ff;
    --text: var(--cyan);
    --subtext: #555;
    --char: #e6a800;
    --env: #00a87a;
    --con: #7c5fe6;
    --filter-bar: rgba(10, 10, 10, 0.9);
    --card-shadow: rgba(0, 243, 255, 0.05);
    --card-shadow-hover: rgba(0, 243, 255, 0.2);
    --skeleton: #1a1a1a;
}

/* --- RESET & BASE --- */
*{margin:0;padding:0;box-sizing:border-box}
body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

header { padding: 6rem 2rem 3rem; text-align: center; }
.logo { 
    font-family: 'Fredoka One', cursive; 
    font-size: 4rem; 
    letter-spacing: -2px; 
    color: var(--cyan);
    text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
}
.logo span { color: var(--accent); text-shadow: none; }
.tagline { 
    font-size: 0.85rem; 
    font-weight: 800; 
    letter-spacing: 0.3em; 
    color: #444; 
    text-transform: uppercase;
    margin-top: 10px;
}

/* --- FILTERS --- */
.filter-row {
    display: flex; justify-content: center; gap: 12px; padding: 2rem; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 1000;
    background: var(--filter-bar); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
}
.filter-btn {
    border: 1px solid #222; padding: 0.7rem 1.6rem; border-radius: 50px; 
    background: #111; color: #777;
    font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase;
    transition: all 0.3s ease;
}
.filter-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }
.filter-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

/* Category Active States */
.filter-btn.active[data-filter="character"] { background: var(--char); border-color: var(--char); color: #fff; box-shadow: 0 0 15px rgba(230, 168, 0, 0.3); }
.filter-btn.active[data-filter="background"] { background: var(--env); border-color: var(--env); color: #fff; box-shadow: 0 0 15px rgba(0, 168, 122, 0.3); }
.filter-btn.active[data-filter="concept"] { background: var(--con); border-color: var(--con); color: #fff; box-shadow: 0 0 15px rgba(124, 95, 230, 0.3); }

/* --- MASONRY GALLERY --- */
.gallery-container { max-width: 1450px; margin: 0 auto; padding: 0 2rem 5rem; }
.gallery { columns: 3; column-gap: 2.5rem; }
@media (max-width: 1100px) { .gallery { columns: 2; } }
@media (max-width: 700px) { .gallery { columns: 1; } }

.card {
    break-inside: avoid-column;
    margin-bottom: 2.5rem;
    position: relative;
    cursor: pointer;
    border-radius: 20px;
    background: var(--card-bg);
    box-shadow: 0 10px 30px var(--card-shadow);
    transition: box-shadow 0.4s ease;
    min-height: 200px;
}

.card-content {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--skeleton);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.card img {
    width: 100%; display: block;
    opacity: 0;
    transition: opacity 0.8s ease, transform 0.8s ease;
    will-change: opacity, transform;
}
.card img.loaded { opacity: 1; }

.card:hover { box-shadow: 0 20px 50px var(--card-shadow-hover); }
.card:hover .card-content { transform: translateY(-10px); }
.card:hover img { transform: scale(1.05); }

.card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    display: flex; align-items: flex-end; padding: 2rem;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
}
.card:hover .card-overlay { opacity: 1; }
.card-title { color: var(--cyan); font-family: 'Fredoka One', cursive; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,243,255,0.6); }

/* --- LIGHTBOX --- */
.lb-wrap {
    position: fixed; inset: 0; background: rgba(2, 2, 2, 0.98);
    display: none; z-index: 6000; align-items: center; justify-content: center;
    backdrop-filter: blur(20px); padding: 1.5rem;
}
.lb-wrap.open { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.lb-box { max-width: 1200px; width: 100%; display: flex; flex-direction: column; align-items: center; }
.lb-img-container { background: #000; border-radius: 15px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid #222; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
.lb-img-container img { max-width: 100%; max-height: 72vh; display: block; }
.lb-name { color: var(--cyan); font-family: 'Fredoka One', cursive; font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; text-shadow: 0 0 20px var(--cyan); }

.lb-nav { display: flex; gap: 15px; margin-top: 1rem; }
.btn { border: none; padding: 0.9rem 2.2rem; border-radius: 50px; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.8rem; letter-spacing: 0.1em; }
.btn-main { background: var(--cyan); color: #000; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
.btn-close { background: var(--accent); color: #fff; }
.btn:hover { transform: scale(1.05); filter: brightness(1.1); }

.pill-container { display: flex; gap: 10px; margin-bottom: 1rem; }
.pill { padding: 5px 15px; border-radius: 20px; color: #fff; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.tag-character { background: var(--char); }
.tag-background { background: var(--env); }
.tag-concept { background: var(--con); }
.count-badge { text-align: center; font-weight: 800; color: #333; font-size: 0.75rem; margin-bottom: 3rem; letter-spacing: 0.2em; }
</style>
</head>
<body>

<header>
    <div class="logo">BigOne<span>.</span></div>
    <div class="tagline">2D Artist &bull; Character Designer &bull; Concept Artist</div>
</header>

<div class="filter-row">
    <button class="filter-btn active" data-filter="all">All Portfolio</button>
    <button class="filter-btn" data-filter="character">Characters</button>
    <button class="filter-btn" data-filter="background">Environments</button>
    <button class="filter-btn" data-filter="concept">Concepts</button>
</div>

<div class="count-badge" id="count-badge">DATA LOADING...</div>

<div class="gallery-container">
    <div class="gallery" id="gallery"></div>
</div>

<!-- LIGHTBOX -->
<div class="lb-wrap" id="lb-wrap">
    <div class="lb-box">
        <div class="lb-img-container"><img id="lb-img" src="" alt=""></div>
        <div class="lb-name" id="lb-title"></div>
        <div class="pill-container" id="lb-pill-box"></div>
        <div class="lb-nav">
            <button class="btn btn-main" id="lb-prev">PREV</button>
            <button class="btn btn-close" id="lb-close">CLOSE</button>
            <button class="btn btn-main" id="lb-next">NEXT</button>
        </div>
    </div>
</div>

<script>
// --- ART DATA ---
// Add 'rendered' tag to any image to push it to the TOP of the gallery
const myArt = [
    { src: 'images/c1c2_front.png', name: 'c1 and c2 ref', tags: ['character', 'concept', 'rendered'] },
    { src: 'images/11_ghost_jewel_big_green_apple.png', name: 'C11 and Jewel Fanart', tags: ['character'] },
    { src: 'images/c3_monolithic.jpg', name: 'C3 Monolithic', tags: ['character', 'rendered'] },
    { src: 'images/c3_old.png', name: 'C3 Old', tags: ['character'] },
    { src: 'images/c3_oldref.png', name: 'C3 Old Ref', tags: ['character', 'concept'] },
    { src: 'images/c3_wired.png', name: 'C3 Wired', tags: ['character'] },
    { src: 'images/c4_ref.png', name: 'C4 Ref', tags: ['character', 'concept'] },
    { src: 'images/c5_domain.jpg', name: 'C5 Domain', tags: ['character'] },
    { src: 'images/c8_wall.png', name: 'C8 Wall', tags: ['character'] },
    { src: 'images/c9.png', name: 'C9', tags: ['character'] },
    { src: 'images/c9_cloud.png', name: 'C9 Cloud', tags: ['character'] },
    { src: 'images/c9_cloud2.png', name: 'C9 Cloud 2', tags: ['character'] },
    { src: 'images/c9_concept.png', name: 'C9 Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_avianalt_concept.png', name: 'C11 Alt Concept', tags: ['character', 'concept'] },
    { src: 'images/c11_dawn.png', name: 'C11 Dawn', tags: ['character'] },
    { src: 'images/c11_magic.png', name: 'C11 Magic', tags: ['character'] },
    { src: 'images/c11_summit.png', name: 'C11 Summit', tags: ['character'] },
    { src: 'images/c11_twilight.png', name: 'C11 Twilight', tags: ['character'] },
    { src: 'images/c34_lab.jpg', name: 'C34 Lab', tags: ['character'] },
    { src: 'images/c78_wall.png', name: 'C78 Wall', tags: ['character'] },
    { src: 'images/catalyst_bg.png', name: 'Catalyst', tags: ['background'] },
    { src: 'images/character9float.png', name: 'Character 9 Float', tags: ['character'] },
    { src: 'images/thing.png', name: 'Thing', tags: ['background'] },
    { src: 'images/towers_bg.png', name: 'Towers', tags: ['background'] },
    { src: 'images/towerv2_bg.png', name: 'Tower V2', tags: ['background'] },
    { src: 'images/triangle_bg.png', name: 'Triangle', tags: ['background'] },
    { src: 'images/water.png', name: 'Water', tags: ['background'] },
    { src: 'images/aether_bg.png', name: 'Aether', tags: ['background'] },
    { src: 'images/airship_bg.png', name: 'Airship', tags: ['background'] },
    { src: 'images/bgs_concept.png', name: 'BGs Concept', tags: ['background', 'concept'] },
    { src: 'images/domain.jpg', name: 'Domain', tags: ['background'] },
    { src: 'images/figment_concept.png', name: 'Figment Concept', tags: ['background', 'concept'] },
    { src: 'images/northman_concept.png', name: 'Northman Concept', tags: ['character', 'concept'] },
    { src: 'images/scatter_bg.png', name: 'Scatter', tags: ['background'] },
    { src: 'images/Shapes.png', name: 'Shapes', tags: ['background'] },
    { src: 'images/ship2_bg.png', name: 'Ship 2', tags: ['background'] },
    { src: 'images/shipconcept.png', name: 'Ship Concept', tags: ['background', 'concept'] },
    { src: 'images/tank_bg.png', name: 'Tank', tags: ['background'] }
];

const gallery=document.getElementById('gallery');
const lbWrap=document.getElementById('lb-wrap');
const lbImg=document.getElementById('lb-img');
const lbTitle=document.getElementById('lb-title');
const lbPills=document.getElementById('lb-pill-box');
const cnt=document.getElementById('count-badge');
let activeFilters = [], filtered=[], idx=0;

function render(){
    gallery.innerHTML = '';
    
    // 1. Filter items based on selected category
    filtered = myArt.filter(item => {
        if (activeFilters.length === 0) return true;
        return activeFilters.every(f => item.tags.includes(f));
    });

    // 2. Sort items so 'rendered' tag comes first
    filtered.sort((a, b) => {
        const aRen = a.tags.includes('rendered');
        const bRen = b.tags.includes('rendered');
        if (aRen && !bRen) return -1;
        if (!aRen && bRen) return 1;
        return 0;
    });

    cnt.textContent = filtered.length + ' PIECES REVEALED';
    
    filtered.forEach((w,i)=>{
        const c=document.createElement('div');
        c.className='card';
        c.innerHTML=`<div class="card-content">
            <img src="${w.src}" alt="${w.name}" onload="this.classList.add('loaded')">
            <div class="card-overlay"><div class="card-title">${w.name}</div></div>
        </div>`;
        c.addEventListener('click',()=>openLb(i));
        gallery.appendChild(c);
    });
}

function openLb(i){
    idx=i; const w=filtered[i];
    lbImg.src=w.src; lbTitle.textContent=w.name;
    
    // Hidden Tag Check: We filter out 'rendered' so it doesn't show up as a pill
    lbPills.innerHTML = w.tags
        .filter(t => t !== 'rendered')
        .map(t => `<span class="pill tag-${t}">${t}</span>`)
        .join('');

    lbWrap.classList.add('open');
    document.body.style.overflow = 'hidden'; 
}

function closeLb(){ lbWrap.classList.remove('open'); document.body.style.overflow = 'auto'; }
lbWrap.addEventListener('click', (e) => { if (e.target === lbWrap) closeLb(); });
document.getElementById('lb-close').addEventListener('click',closeLb);
document.getElementById('lb-prev').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx-1+filtered.length)%filtered.length; openLb(idx); });
document.getElementById('lb-next').addEventListener('click',(e)=>{ e.stopPropagation(); idx=(idx+1)%filtered.length; openLb(idx); });

document.addEventListener('keydown', (e) => {
    if (!lbWrap.classList.contains('open')) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") { idx=(idx-1+filtered.length)%filtered.length; openLb(idx); }
    if (e.key === "ArrowRight") { idx=(idx+1)%filtered.length; openLb(idx); }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const f = btn.dataset.filter;
        if (f === 'all') {
            activeFilters = [];
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        } else {
            document.querySelector('[data-filter="all"]').classList.remove('active');
            if (activeFilters.includes(f)) {
                activeFilters = activeFilters.filter(item => item !== f);
                btn.classList.remove('active');
            } else {
                activeFilters.push(f);
                btn.classList.add('active');
            }
            if (activeFilters.length === 0) document.querySelector('[data-filter="all"]').classList.add('active');
        }
        render();
    });
});

render();
</script>
</body>
</html>
