<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigOne — 2D Artist Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* ... (Same styles as before) ... */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#fffdf7;color:#1a1a1a;min-height:100vh}
header{padding:2rem 2rem 1rem;text-align:center}
.logo{font-family:'Fredoka One',cursive;font-size:2.4rem;color:#1a1a1a}
.logo .dot{color:#ff6b6b}
.tagline{font-size:0.85rem;font-weight:700;color:#555;letter-spacing:0.1em;text-transform:uppercase;margin-top:0.3rem}
.color-strip{display:flex;height:6px;border-radius:99px;overflow:hidden;margin:1rem 2rem 0}
.color-strip div{flex:1}
.filter-row{display:flex;gap:0.5rem;padding:1.2rem 2rem;flex-wrap:wrap;justify-content:center}
.filter-btn{font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:800;padding:0.45rem 1.2rem;border-radius:99px;cursor:pointer;border:none;background:#3a3a3a;color:#fff;transition:all 0.18s;letter-spacing:0.04em;text-transform:uppercase}
.filter-btn:hover{background:#111;transform:translateY(-2px)}
.filter-btn.active[data-filter=all]{background:#ff6b6b}
.filter-btn.active[data-filter=character]{background:#e6a800}
.filter-btn.active[data-filter=background]{background:#00a87a}
.filter-btn.active[data-filter=concept]{background:#7c5fe6}
.filter-btn.active[data-filter=comic]{background:#e05c00}
.count-badge{text-align:center;font-size:0.78rem;font-weight:700;color:#888;letter-spacing:0.08em;text-transform:uppercase;padding:0 2rem 0.8rem}
.gallery{padding:0.5rem 1.5rem 3rem;columns:3;column-gap:0.9rem}
@media(max-width:560px){.gallery{columns:2}}
.card{break-inside:avoid;margin-bottom:0.9rem;border-radius:16px;overflow:hidden;cursor:pointer;border:2.5px solid #ece8df;transition:transform 0.2s,box-shadow 0.2s;position:relative}
.card:hover{transform:translateY(-4px) rotate(-0.5deg);box-shadow:0 8px 24px rgba(0,0,0,0.10)}
.card img{width:100%;display:block;background:#f0ece3;object-fit:cover}
.card-overlay{position:absolute;inset:0;background:rgba(255,253,245,0.94);opacity:0;transition:opacity 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px}
.card:hover .card-overlay{opacity:1}
.card-name{font-family:'Fredoka One',cursive;font-size:1rem;color:#1a1a1a;text-align:center;padding:0 0.5rem}
.pill{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;padding:4px 12px;border-radius:99px;color:#fff}
.tag-character{background:#e6a800}
.tag-background{background:#00a87a}
.tag-concept{background:#7c5fe6}
.tag-comic{background:#e05c00}
.lb-wrap{background:#fffdf7;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem;border-top:2.5px solid #ece8df;margin-top:1rem;min-height:420px}
.lb-wrap.open{display:flex}
.lb-img-box{border-radius:20px;overflow:hidden;border:3px solid #ece8df;max-width:100%}
.lb-img-box img{max-width:100%;max-height:60vh;display:block;object-fit:contain}
.lb-title{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#1a1a1a;text-align:center}
.lb-nav{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-top:0.4rem}
.lb-btn{font-family:'Nunito',sans-serif;font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;padding:0.5rem 1.4rem;border-radius:99px;cursor:pointer;border:none;background:#3a3a3a;color:#fff;transition:all 0.18s}
.lb-btn:hover{background:#111}
.lb-close-btn{background:#ff6b6b}
.lb-close-btn:hover{background:#e05555}
.fade-in{animation:pop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0}
@keyframes pop{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<header>
  <div class="logo">BigOne<span class="dot">.</span></div>
  <div class="tagline">2D Artist &nbsp;·&nbsp; Portfolio</div>
</header>

<div class="color-strip">
  <div style="background:#ff6b6b"></div>
  <div style="background:#e6a800"></div>
  <div style="background:#06d6a0"></div>
  <div style="background:#7c5fe6"></div>
  <div style="background:#e05c00"></div>
</div>

<div class="filter-row">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="character">Characters</button>
  <button class="filter-btn" data-filter="background">Backgrounds</button>
  <button class="filter-btn" data-filter="concept">Concepts</button>
  <button class="filter-btn" data-filter="comic">Comics</button>
</div>

<div class="count-badge" id="count-badge">Gallery</div>

<div class="gallery" id="gallery">
  <!-- Images will load here automatically -->
</div>

<div class="lb-wrap" id="lb-wrap">
  <div class="lb-img-box"><img id="lb-img" src="" alt=""></div>
  <div class="lb-title" id="lb-title"></div>
  <div id="lb-pill"></div>
  <div class="lb-nav">
    <button class="lb-btn" id="lb-prev">← Prev</button>
    <button class="lb-btn lb-close-btn" id="lb-close">Close</button>
    <button class="lb-btn" id="lb-next">Next →</button>
  </div>
</div>

<script>
/** 
 * MANAGE YOUR ART HERE
 * To add art: 
 * 1. Upload your image to GitHub in an 'images' folder.
 * 2. Add a line below like this: { src: 'images/yourfile.jpg', name: 'Cool Art', tag: 'character' },
 * Tags available: character, background, concept, comic
 */
const myArt = [
  { src: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe', name: 'Example Character', tag: 'character' },
  { src: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5', name: 'Example Concept', tag: 'concept' },
];

const gallery=document.getElementById('gallery');
const lbWrap=document.getElementById('lb-wrap');
const lbImg=document.getElementById('lb-img');
const lbTitle=document.getElementById('lb-title');
const lbPill=document.getElementById('lb-pill');
const cnt=document.getElementById('count-badge');
let filtered=[],idx=0,filter='all';
const tc={character:'tag-character',background:'tag-background',concept:'tag-concept',comic:'tag-comic'};

function updateCnt(){const n=filtered.length;cnt.textContent=n+(n===1?' work':' works');}

function render(){
  gallery.innerHTML = '';
  filtered=filter==='all'?[...myArt]:myArt.filter(w=>w.tag===filter);
  updateCnt();
  filtered.forEach((w,i)=>{
    const c=document.createElement('div');
    c.className='card fade-in';c.style.animationDelay=(i*0.05)+'s';
    c.innerHTML=`<img src="${w.src}" alt="${w.name}"><div class="card-overlay"><div class="card-name">${w.name}</div><span class="pill ${tc[w.tag]}">${w.tag}</span></div>`;
    c.addEventListener('click',()=>openLb(i));
    gallery.appendChild(c);
  });
}

function openLb(i){idx=i;const w=filtered[i];lbImg.src=w.src;lbImg.alt=w.name;lbTitle.textContent=w.name;lbPill.innerHTML=`<span class="pill ${tc[w.tag]}">${w.tag}</span>`;lbWrap.classList.add('open');lbWrap.scrollIntoView({behavior:'smooth',block:'nearest'});}
function closeLb(){lbWrap.classList.remove('open')}
document.getElementById('lb-close').addEventListener('click',closeLb);
document.getElementById('lb-prev').addEventListener('click',()=>{idx=(idx-1+filtered.length)%filtered.length;openLb(idx)});
document.getElementById('lb-next').addEventListener('click',()=>{idx=(idx+1)%filtered.length;openLb(idx)});
document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;render();});});

// Initial load
render();
</script>
</body>
</html>
